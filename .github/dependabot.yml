# Keeps pinned versions current: actions are pinned to commit SHAs, so updates arrive as reviewed PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/platform
    schedule:
      interval: weekly
