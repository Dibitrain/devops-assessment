# kube-prometheus-stack values for EKS. Installed by Terraform (infra/terraform/platform/addons.tf).
# Grafana and Prometheus are cluster-internal only; reach them with `kubectl port-forward`.

# EKS runs the control plane for you; these components cannot be scraped and would only raise alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from every namespace, not only ones labelled with
    # this Helm release. The app chart ships its own ServiceMonitor and PrometheusRule.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    # Base solution keeps metrics on an emptyDir. For durable metrics, install the EBS CSI driver and
    # add a storageSpec volumeClaimTemplate, or remote-write to Amazon Managed Prometheus.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

grafana:
  # The admin password is generated by the chart and stored in the "kube-prometheus-stack-grafana"
  # Secret. Read it with:
  #   kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
  defaultDashboardsTimezone: utc
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
