apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounts-api.fullname" . }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "accounts-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # Cluster-internal only: the Ingress never routes to this port.
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
