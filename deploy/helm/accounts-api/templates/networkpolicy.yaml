{{- if .Values.networkPolicy.enabled }}
# Default deny, then allow only: HTTP from the load balancer's network, metrics from the monitoring
# namespace, and DNS out. The app makes no outbound calls, so a compromised pod cannot exfiltrate data
# or reach the node metadata service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "accounts-api.fullname" . }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "accounts-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.ingressFromCidr }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: metrics
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
