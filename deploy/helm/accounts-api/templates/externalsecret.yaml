{{- if and .Values.auth.enabled .Values.auth.externalSecret.enabled (not .Values.auth.existingSecret) }}
# Pulls the API key from AWS Secrets Manager into a Kubernetes Secret. With no `auth` block, the store
# uses the External Secrets controller's EKS Pod Identity role, which Terraform scopes to this one secret
# and its KMS key.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "accounts-api.fullname" . }}-aws
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.auth.externalSecret.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "accounts-api.authSecretName" . }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ include "accounts-api.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ include "accounts-api.authSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: {{ .Values.auth.externalSecret.remoteKey }}
        property: API_KEY
{{- end }}
